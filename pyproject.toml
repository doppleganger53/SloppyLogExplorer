[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sloppy-log-explorer"
version = "0.1.0"
description = "A polished desktop explorer for FrSky Ethos and OpenTX telemetry logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Keith" }]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "PyQt6>=6.6.0",
  "PyQt6-WebEngine>=6.6.0",
  "plotly>=5.0.0",
  "kaleido>=0.2.1",
  "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
sloppy-log-explorer = "sloppy_log_explorer.__main__:main"

[tool.setuptools.packages.find]
include = ["sloppy_log_explorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
