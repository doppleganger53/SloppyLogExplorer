[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sloppy-log-explorer"
version = "0.2.1"
description = "A polished desktop explorer for FrSky Ethos and OpenTX telemetry logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "doppleganger53" }]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "PyQt6>=6.11.0",
  "PyQt6-Qt6>=6.11.2",
  "PyQt6-WebEngine>=6.11.0",
  "PyQt6-WebEngine-Qt6>=6.11.2",
  "plotly>=7.1.0",
  "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pandas-stubs"]
build = ["pyinstaller>=6.0.0"]

[project.scripts]
sloppy-log-explorer = "sloppy_log_explorer.__main__:main"

[tool.setuptools.packages.find]
include = ["sloppy_log_explorer*"]

[tool.setuptools.package-data]
sloppy_log_explorer = ["assets/maplibre/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
